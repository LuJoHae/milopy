[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "milorpy"
version = "0.2.0"
description = "A native Python implementation of miloR for differential abundance testing"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scanpy",
    "anndata",
    "edgepython",
    "patsy"
]

[project.optional-dependencies]
test = [
    "pytest",
    "rpy2",
    "anndata2ri"
]

